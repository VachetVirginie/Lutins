<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1e19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Mon aventure des lutins : préparez chaque soir la farce de vos lutins, recevez leurs lettres personnalisées et vivez un calendrier de l'Avent magique en famille, synchronisé avec les proches." />
    <link rel="preload" as="image" href="/assets/created/arrival-mobile-hero.webp" fetchpriority="high" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond.woff2" crossorigin />
    <title>Mon aventure des lutins</title>
    <style>
      /* Squelette de l'écran d'ouverture : peint avant le boot de Vue (LCP),
         remplacé par le vrai composant au montage. Reprend les styles de
         OpeningView (mobile uniquement, la coquille desktop est différente). */
      .opening-skeleton{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;min-height:100svh;max-width:540px;margin:auto;padding-bottom:calc(38px + env(safe-area-inset-bottom));overflow:hidden;background:#10231e;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
      .os-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:58% 78%;filter:brightness(1.09) contrast(1.06) saturate(1.04)}
      .os-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,18,15,.72) 0%,rgba(4,18,15,.36) 48%,rgba(4,18,15,.08) 78%),linear-gradient(180deg,rgba(7,26,22,.62) 0%,rgba(7,26,22,.08) 42%,rgba(7,26,22,.78) 100%)}
      .os-copy{position:relative;z-index:1;grid-row:2;align-self:start;padding:clamp(28px,6vh,58px) 28px 24px}
      .os-chapter{display:flex;align-items:center;gap:9px;margin:0 0 30px;color:#f1cc7a;font-size:8px;font-weight:700;letter-spacing:.24em;opacity:.82}
      .os-chapter i{width:22px;height:1px;background:#f1cc7a}
      .os-kicker{max-width:310px;margin:0 0 8px;font-size:14px;letter-spacing:.01em;opacity:.92}
      .os-copy h1{max-width:300px;margin:0;font:500 clamp(40px,10vw,58px)/.93 Georgia,serif;letter-spacing:-.065em}
      .os-copy h1 em{color:#f1cc7a;font-style:italic}
      .os-subtitle{max-width:235px;margin:22px 0 0;font-size:14px;line-height:1.4;opacity:.82}
      .os-entry{position:relative;z-index:1;grid-row:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;margin:0 28px}
      .os-seal{width:86px;height:86px;border-radius:50%;background:radial-gradient(circle,#3d2b16,#1c130a);box-shadow:0 0 0 2px rgba(241,204,122,.35),0 6px 24px rgba(0,0,0,.5)}
      .os-hint{display:grid;gap:3px;margin:2px 0 0;justify-items:center;text-align:center}
      .os-hint b{color:#f1cc7a;font-size:9.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
      .os-hint span{color:rgba(255,255,255,.7);font:italic 400 13.5px 'Cormorant Garamond',Georgia,serif}
      @media(max-width:380px){.os-image{object-position:58% 74%}.os-copy{padding-right:24px;padding-left:24px}.os-copy h1{font-size:40px}}
      @media(max-height:700px){.os-copy{padding-top:24px;padding-bottom:16px}.os-subtitle{margin-top:20px}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Squelette instantané : uniquement sur l'ouverture mobile ; Vue remplace
      // tout le contenu de #app au montage (mount() efface l'innerHTML).
      ;(function () {
        if (location.pathname !== '/' || matchMedia('(min-width: 1024px)').matches) return
        var noms = [], nuits = 70
        try {
          var s = JSON.parse(localStorage.getItem('lutin:adventure-state') || '{}')
          if (Array.isArray(s.prenoms_enfants)) noms = s.prenoms_enfants.filter(Boolean)
          var d1 = s.date_debut ? new Date(s.date_debut + 'T00:00:00') : new Date(2026, 9, 17)
          var d2 = s.date_fin ? new Date(s.date_fin + 'T00:00:00') : new Date(2026, 11, 25)
          if (!isNaN(d1) && !isNaN(d2)) nuits = Math.max(1, Math.min(70, Math.round((d2 - d1) / 864e5) + 1))
        } catch (e) {}
        var kicker = noms.length === 0 ? 'L’aventure de votre famille'
          : noms.length === 1 ? 'L’aventure de ' + noms[0]
          : 'L’aventure de ' + noms.slice(0, -1).join(', ') + ' et ' + noms[noms.length - 1]
        document.getElementById('app').innerHTML =
          '<main class="opening-skeleton">' +
            '<img class="os-image" src="/assets/created/arrival-mobile-hero.webp" alt="" fetchpriority="high" />' +
            '<div class="os-overlay"></div>' +
            '<section class="os-copy">' +
              '<p class="os-chapter"><i></i> ' + nuits + ' NUITS DE MERVEILLES <i></i></p>' +
              '<p class="os-kicker">' + kicker + '</p>' +
              '<h1>La magie a une adresse :<br /><em>la vôtre.</em></h1>' +
              '<p class="os-subtitle">Chaque nuit, une dépêche du Pôle Nord. Une aventure de lutins qui s’écrit chez vous, en famille.</p>' +
            '</section>' +
            '<section class="os-entry"><span class="os-seal"></span>' +
              '<p class="os-hint"><b>Briser le sceau</b><span>Maintenez un instant — la porte s’ouvre</span></p>' +
            '</section>' +
          '</main>'
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
